name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate OpenAPI spec
        run: npm run docs:generate

      - name: Test
        run: npm test
